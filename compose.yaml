# Single entrypoint:  docker compose up -d
# Each service keeps its config/data/Dockerfile in ./<service>/

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 200
  mem_limit: 256m
  cpus: 1.0
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  wireguard:
    # wg-easy v14: WireGuard + web admin UI (password via PASSWORD_HASH)
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    env_file: .env
    environment:
      WG_HOST: ${WG_HOST}              # public IP / DDNS name clients connect to (set in .env)
      PASSWORD_HASH: ${PASSWORD_HASH}  # bcrypt hash, set in .env
      WG_PORT: "51820"
      PORT: "51821"                    # admin UI port
      WG_DEFAULT_DNS: 1.1.1.1
      WG_DEFAULT_ADDRESS: 10.13.13.x
      TZ: Etc/UTC
    volumes:
      - ./wireguard/config:/etc/wireguard
    ports:
      - "51820:51820/udp"              # WireGuard (forward this on your router)
      - "51821:51821/tcp"              # admin web UI
    cap_add: [NET_ADMIN, SYS_MODULE]
    mem_limit: 256m
    cpus: 0.5
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  samba:
    # Read-only SMB share of /mnt/ssd/downloads (authenticated; creds in .env)
    <<: *hardened
    image: dockurr/samba:latest
    container_name: samba
    # Entrypoint creates the user, chowns share/config and runs smbd as root,
    # so a few caps are added back; everything else stays dropped.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    # entrypoint runs adduser (writes /etc/passwd etc.), so rootfs can't be read-only
    read_only: false
    environment:
      NAME: downloads
      USER: ${SMB_USER:-smb}
      PASS: ${SMB_PASS:?set SMB_PASS in .env}
      UID: "1000"
      GID: "1000"
      RW: "false"
    volumes:
      - /mnt/ssd/downloads:/storage:ro
      - ./samba/smb.conf:/etc/samba/smb.conf:ro   # tuned config (replaces generated one)
    ports:
      - "445:445/tcp"
    cpus: 0.25
    mem_limit: 256m

  nfs:
    # Read-only NFSv4 export of /mnt/ssd/downloads (LAN only, port 2049)
    build: ./nfs
    container_name: nfs
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:                           # least privilege instead of privileged: true
      - SYS_ADMIN                      # mount rpc_pipefs/nfsd, start kernel nfsd
    security_opt:
      - no-new-privileges:true
    environment:
      PERMITTED: 192.168.100.0/24      # only the LAN may mount
    volumes:
      - /mnt/ssd/downloads:/export:ro
    ports:
      - "192.168.100.59:2049:2049/tcp"
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  qbittorrent:
    # qBittorrent; Web UI LAN-only on 8080. Writes only to /mnt/ssd/downloads.
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]   # s6 init needs these to drop to PUID
    security_opt: ["no-new-privileges:true"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/ssd/downloads:/downloads
    ports:
      - "192.168.100.59:8080:8080/tcp"   # Web UI (LAN only)
    pids_limit: 300
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
