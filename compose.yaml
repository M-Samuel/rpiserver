# Single entrypoint:  docker compose up -d
# Each service keeps its config/data/Dockerfile in ./<service>/

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 200
  mem_limit: 256m
  cpus: 1.0
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  wireguard:
    # wg-easy v14: WireGuard + web admin UI (password via PASSWORD_HASH)
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    env_file: .env
    environment:
      WG_HOST: ${WG_HOST}              # public IP / DDNS name clients connect to (set in .env)
      PASSWORD_HASH: ${PASSWORD_HASH}  # bcrypt hash, set in .env
      WG_PORT: "51820"
      PORT: "51821"                    # admin UI port
      WG_DEFAULT_DNS: 1.1.1.1
      WG_DEFAULT_ADDRESS: 10.13.13.x
      TZ: Etc/UTC
    volumes:
      - ./wireguard/config:/etc/wireguard
    ports:
      - "51820:51820/udp"              # WireGuard (forward this on your router)
      - "127.0.0.1:51821:51821/tcp" # admin web UI (LAN only)
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]    # no SYS_MODULE: wireguard is in the host kernel
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    init: true
    mem_limit: 256m
    cpus: 0.5
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  samba:
    # Read-only SMB share of /mnt/ssd/downloads (authenticated; creds in .env)
    <<: *hardened
    image: dockurr/samba:latest
    container_name: samba
    # Entrypoint creates the user, chowns share/config and runs smbd as root,
    # so a few caps are added back; everything else stays dropped.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    # entrypoint runs adduser (writes /etc/passwd etc.), so rootfs can't be read-only
    read_only: false
    environment:
      NAME: downloads
      USER: ${SMB_USER:-smb}
      PASS: ${SMB_PASS:?set SMB_PASS in .env}
      UID: "1000"
      GID: "1000"
      RW: "false"
    volumes:
      - /mnt/ssd/downloads:/storage:ro
      - ./samba/smb.conf:/etc/samba/smb.conf:ro   # tuned config (replaces generated one)
    ports:
      - "192.168.100.59:445:445/tcp"   # LAN only
    cpus: 0.25
    mem_limit: 256m

  samba-others:
    # Read-only SMB share of /mnt/ssd/.others (same auth/creds as samba; port 4450 since 445 is taken)
    <<: *hardened
    image: dockurr/samba:latest
    container_name: samba-others
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    read_only: false
    environment:
      NAME: others
      USER: ${SMB_USER:-smb}
      PASS: ${SMB_PASS:?set SMB_PASS in .env}
      UID: "1000"
      GID: "1000"
      RW: "false"
    volumes:
      - /mnt/ssd/.others:/storage:ro
      - ./samba/smb-others.conf:/etc/samba/smb.conf:ro
    ports:
      - "192.168.100.59:4450:445/tcp"  # LAN only
    cpus: 0.25
    mem_limit: 256m

  qbittorrent:
    # qBittorrent; Web UI localhost-only on 8080. Writes only to /mnt/ssd/downloads.
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]   # s6 init needs these to drop to PUID
    security_opt: ["no-new-privileges:true"]
    read_only: true                    # (no init: true — s6 must be PID 1)
    tmpfs: ["/run:exec,mode=755", /tmp]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/ssd/downloads:/downloads
    ports:
      - "127.0.0.1:7502:8080/tcp"        # Web UI (localhost only)
    pids_limit: 300
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ddns:
    # Updates the Cloudflare A record with this host's public IP every DDNS_INTERVAL seconds.
    <<: *hardened
    image: curlimages/curl:latest
    container_name: ddns
    entrypoint: ["/bin/sh", "/update.sh"]
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in .env}
      CF_ZONE_ID: ${CF_ZONE_ID:?set CF_ZONE_ID in .env}
      CF_RECORD_ID: ${CF_RECORD_ID:?set CF_RECORD_ID in .env}
      CF_RECORD_NAME: ${CF_RECORD_NAME:?set CF_RECORD_NAME in .env}
      DDNS_INTERVAL: ${DDNS_INTERVAL:-300}
    volumes:
      - ./ddns/update.sh:/update.sh:ro
    mem_limit: 64m
    cpus: 0.1
