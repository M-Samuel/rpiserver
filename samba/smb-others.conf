# Tuned for streaming large files, read-only, from a Raspberry Pi.
[global]
    server string = samba
    idmap config * : range = 3000-7999
    security = user
    map to guest = never
    server min protocol = SMB2_10
    server max protocol = SMB3

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    host msdfs = no
    wide links = yes
    follow symlinks = yes
    unix extensions = no
    mangled names = no
    unix charset = UTF-8

    # --- performance ---
    use sendfile = yes
    getwd cache = yes
    smb encrypt = off
    server signing = default

    # skip features that only add overhead for a plain read-only share
    ea support = no
    store dos attributes = no
    map archive = no
    map hidden = no
    map system = no
    nt acl support = no
    log level = 1
    max log size = 1000

[others]
    path = /storage
    comment = others
    browseable = yes
    read only = yes
    writable = no
    oplocks = yes
    level2 oplocks = yes
    kernel oplocks = no
